# ============================================================================
# dev-framework Configuration — DealFlow
# ============================================================================
# Hackathon entry for "Authorized to Act: Auth0 for AI Agents"
# AI sales agent with Auth0 Token Vault + Claude + Upstash Redis
# ============================================================================

project:
  name: "dealflow"
  repo: "cdjgroup/dealflow-ai"
  description: "AI sales agent with Auth0 Token Vault — hackathon entry for Authorized to Act"

# ============================================================================
# Paths
# ============================================================================
paths:
  worktree_base: "${HOME}/worktrees"

# ============================================================================
# Stack Configuration
# ============================================================================
stack:
  frontend:
    language: "typescript"
    version: "22"
    test_command: "npm test"
    start_command: "npm run dev"
    port: 3000
    health_endpoint: "/"

# ============================================================================
# Versioning
# ============================================================================
versioning:
  primary_source: "package.json"
  primary_pattern: '"version"'
  locations:
    - file: "package.json"
      pattern: '"version": "VERSION"'
      sed: 's/"version": "[0-9.]*"/"version": "VERSION"/'
      display: "package.json"
    - file: "CLAUDE.md"
      pattern: "Current Version: VERSION"
      sed: 's/Current Version: [0-9.]*/Current Version: VERSION/'
      display: "CLAUDE.md"

# ============================================================================
# CI/CD Configuration
# ============================================================================
ci:
  blocking_jobs:
    - "frontend-tests"
    - "env-secrets-guard"
  advisory_jobs:
    - "docs-validation"
  protected_branches:
    - "main"

# ============================================================================
# Notifications
# ============================================================================
notifications:
  provider: "none"
  webhook_env: "NOTIFICATION_WEBHOOK_URL"

# ============================================================================
# TDD Configuration
# ============================================================================
tdd:
  attribution: ""
  require_tests: true

# ============================================================================
# Claude Integration
# ============================================================================
claude:
  worktree_enforcement: true
  auto_sync: true
  session_timeout: 1800
  drift_check_interval: 300

# ============================================================================
# Cost Management
# ============================================================================
cost:
  model_tiers:
    opus: ["ai-architect", "migration-author", "it-security-expert", "ai-code-forensics"]
    sonnet: ["code-reviewer", "performance-reviewer", "ai-testing-expert",
             "api-contract-reviewer", "ux-uxp-specialist", "release-manager",
             "docs-efficiency-expert", "silent-failure-hunter", "type-design-analyzer"]
    haiku: ["documentation-reviewer", "maintainability-reviewer", "comment-analyzer"]
  skip_logic:
    small_diff_threshold: 20
    large_diff_threshold: 500

# ============================================================================
# Rules Configuration
# ============================================================================
rules:
  extract_to_files: true
  anti_patterns: true
  security: true
  database_migrations: false
  sherlock_review_gate: true

# ============================================================================
# Skills Configuration
# ============================================================================
skills:
  deploy: true
  health: true
  release_notes: true
  schema_check: false
  browse: true
  qa: true
  retro: true
  tdd_commit: true
  ship: true

# ============================================================================
# Team Scaling
# ============================================================================
team:
  distribute_agents: false
  distribute_skills: false

# ============================================================================
# Archive Configuration
# ============================================================================
archive:
  insights_threshold: 1500
  version_history_threshold: 800

# ============================================================================
# Visual QA Configuration
# ============================================================================
qa:
  enabled: true
  dev_url: "http://localhost:3000"
  report_dir: ".qa-reports"

# ============================================================================
# Retro Configuration
# ============================================================================
retro:
  enabled: true
  default_window: "7d"
  storage_dir: ".context/retros"
  track_tdd_phases: true

# ============================================================================
# Prompt Versioning
# ============================================================================
prompts:
  versioning: false
  snapshot_dir: "prompt_snapshots"

# ============================================================================
# Deployment Configuration
# ============================================================================
deployment:
  fast_deploy_enabled: true
  post_deploy_monitoring_minutes: 15

# ============================================================================
# Agent Configuration
# ============================================================================
agents:
  custom_agents: []

hooks:
  deploy_gate: false

# ============================================================================
# Metrics Configuration
# ============================================================================
metrics:
  enabled: true
  storage_dir: ".context/metrics"
  max_size_mb: 50
  dashboard:
    output_path: ".context/dashboard.html"
    default_window: "30d"

profile: full

orchestration:
  mode: "subagent"  # "subagent" | "agent-teams"
  agent_teams:
    # Maximum concurrent teammates (cost control — each is a full Claude instance)
    max_concurrent_teammates: 4
    # TDD task chain: sequential enforces RED→GREEN→REFACTOR via blockedBy
    tdd_chain: "sequential"  # "sequential" | "lead-managed"
    # How many review tasks to create simultaneously
    review_parallelism: 5
    # Per-task timeout in minutes
    task_timeout_minutes: 30

# ============================================================================
# Team Scaling
# ============================================================================
# Distribute global agents/skills to project-local .claude/ directories.

providers:
  active: "anthropic"
  capability_tiers:
    high:
      anthropic: "opus"
      openai: "o4-mini"
      google: "gemini-2.5-pro"
    standard:
      anthropic: "sonnet"
      openai: "gpt-4.1"
      google: "gemini-2.5-flash"
    fast:
      anthropic: "haiku"
      openai: "gpt-4.1-mini"
      google: "gemini-2.5-flash"

# ============================================================================
# Rules Configuration
# ============================================================================
# Controls which .claude/rules/ files are created by init-project.sh.
# Set to false to skip creating a rule file (e.g., if your project has no DB).

research:
  # Automatic /deep-r invocation points. Set to false to require manual invocation.
  auto_invoke:
    step_3_research_validate: true   # Full Sherlock Step 3 — approach validation
    step_4_5_plan_validation: true   # Full Sherlock Step 4.5 — red-team the plan
  # Optional invocation points (always manual regardless of these flags)
  optional_points:
    - "step_0_complexity"       # Unfamiliar tech, competitive analysis
    - "step_2_clarifying_qs"    # On-demand during user Q&A
    - "step_4_architecture"     # Per-decision validation
    - "step_8_release_ready"    # Milestone releases, v1 launches
  # Budget hint for cost dashboards (USD per full Sherlock session)
  estimated_cost_per_session: 2.50

# ============================================================================
# Providers
# ============================================================================
# Maps capability tiers to provider-specific model names. The active provider
# determines which model alias is used when generating agent definitions.
#
# This section is the foundation for multi-provider support. Currently only
# anthropic is supported at runtime (Claude Code). Other providers are listed
# for future use with generate-agents.py (Phase 1 of provider abstraction).

schema_version: 1

codex:
  # Include the "Collaborative communication" protocol section in the
  # AGENTS.md generated by `shipteam init --host codex` / `--refresh`.
  # Default true. Set false to opt out; note `--refresh` only updates
  # regions already present in an existing AGENTS.md, so opting out after
  # the section has already been generated once requires manual removal.
  communication_protocol: true

# ============================================================================
# Deployment Configuration
# ============================================================================

extractor:
  # Monthly Batch API spend cap for facets extraction (USD).
  # The extractor will not submit new batches once this limit is reached.
  budget_cap_usd: 25
  # Model used for facets extraction via Anthropic Batch API.
  model: "claude-haiku-4-5"
  # Trim ratio gate (AC-15): skip sessions where trim_and_redact reduces the
  # transcript to more than this fraction of the original (i.e., trim is insufficient).
  trim_ratio_max: 0.40

# ============================================================================
# Agent Configuration
# ============================================================================
# Define project-specific custom agents (placed in .claude/agents/).

worktree:
  enabled: true

# ============================================================================
# Claude Integration
# ============================================================================
