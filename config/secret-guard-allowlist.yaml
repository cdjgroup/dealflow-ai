# Secret guard allowlist — patterns that are safe to ignore
# Used by scripts/validate-no-public-secrets.sh

allowed_prefixes:
  - "AUTH0_SECRET="         # Environment variable reference, not a literal secret
  - "AUTH0_CLIENT_SECRET="  # Environment variable reference
  - "UPSTASH_REDIS_REST_TOKEN=" # Environment variable reference
  - "CRON_SECRET="          # Environment variable reference
  - "ENCRYPTION_KEY="       # Environment variable reference
  - ".env.example"          # Example file with placeholder values
  - "process.env."          # Runtime env access (filtered by script, belt-and-suspenders)
